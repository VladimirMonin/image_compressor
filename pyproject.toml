[project]
name = "image-compressor"
version = "1.0.0"
description = "Create-only image conversion API, headless CLI and optional GUI"
authors = [
    { name = "Vladimir Monin", email = "your-email@example.com" }
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["image", "compression", "gui", "webp", "heic", "avif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = ["Pillow>=12.0.0"]

[project.scripts]
image-compressor = "image_compressor.cli:main"

[project.optional-dependencies]
codecs = ["pillow-heif>=1.1.0", "pillow-avif-plugin>=1.4.0"]
gui-pyside6 = ["PySide6>=6.12,<7"]
build = ["pyinstaller>=6.15.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.19.0",
    "build>=1.2.0",
    "wheel>=0.45.0",
    "setuptools>=68.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["image_compressor", "gui_pyside6_v2"]

[tool.setuptools.package-data]
image_compressor = ["py.typed"]
gui_pyside6_v2 = ["tokens.json", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 90
timeout_method = "thread"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["pillow_heif", "pillow_heif.*", "pillow_avif", "pillow_avif.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.pyinstaller]
# Настройки для PyInstaller
name = "ImageCompressorGUI"
onefile = true
console = false
# icon = "path/to/icon.ico"  # Раскомментируйте и укажите путь к иконке
